name: "welcome-first-time-contributors"
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Thanks for opening your first pull request in Libredesk.

            Please give [CONTRIBUTING.md](https://github.com/abhinavxd/libredesk/blob/main/CONTRIBUTING.md) a read if you haven't already, it covers the setup, code style and the checks this PR needs to pass. A maintainer will review this soon.
